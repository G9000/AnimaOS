[package]
name = "anima-village-game"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anima-village = { path = "../crates/anima-village" }
anima-harness = { path = "../../../packages/core-rust/crates/anima-harness" }
axum = "0.8"
async-trait = "0.1"
keyring = "4.1.6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[package.metadata.dist]
dist = false
