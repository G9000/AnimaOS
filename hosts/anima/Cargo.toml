[package]
name = "anima"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/G9000/animaos"

[[bin]]
name = "anima"
path = "src/main.rs"

[features]
bundled-ui = ["dep:rust-embed"]
# Native installers own the whole installation; never replace only its executable.
native-install = ["bundled-ui"]

[dependencies]
anima-daemon = { path = "../rust-daemon" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }
directories = "6"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
minisign-verify = "0.2"
open = "5"
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.17.2"
rust-embed = { version = "8", features = ["mime-guess"], optional = true }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tao = { version = "0.37.1", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
winreg = "0.56.0"

[dev-dependencies]
minisign = "0.7"
plist = "1.10.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile = "=3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

# Release builds (dist-workspace.toml) embed the web console.
[package.metadata.dist]
dist = true
features = ["bundled-ui"]
