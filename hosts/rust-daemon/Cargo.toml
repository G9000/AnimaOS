[package]
name = "anima-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anima-core = { path = "../../packages/core-rust/crates/anima-core" }
anima-document-content = { path = "../../packages/core-rust/crates/anima-document-content" }
anima-model-adapters = { path = "../../packages/core-rust/crates/anima-model-adapters" }
anima-memory = { path = "../../packages/core-rust/crates/anima-memory", features = ["locomo-eval"] }
anima-schedule = { path = "../../packages/core-rust/crates/anima-schedule" }
anima-swarm = { path = "../../packages/core-rust/crates/anima-swarm" }
atomicwrites = "0.4.4"
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
fastembed = { version = "5.13.4", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
futures = "0.3"
keyring = "4.1.6"
meval = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client", "transport-async-rw"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
sse-stream = "=0.2.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["request-id", "timeout", "trace"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
tempfile = "=3.27.0"
tokio-util = { version = "=0.7.18", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
rfd = "0.17.2"
win-custody = "=0.1.1"

[dev-dependencies]
http-body-util = "0.1"

[[example]]
name = "document_worker_peer"
path = "tests/fixtures/document_worker_peer.rs"

[[example]]
name = "mcp_stdio_peer"
path = "tests/fixtures/mcp_stdio_peer.rs"

[lints]
workspace = true
