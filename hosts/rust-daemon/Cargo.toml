[package]
name = "anima-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anima-service-adapters = { path = "../../packages/core-rust/crates/anima-service-adapters" }
anima-core = { path = "../../packages/core-rust/crates/anima-core" }
anima-harness = { path = "../../packages/core-rust/crates/anima-harness" }
anima-execution-store-sqlite = { path = "../../packages/core-rust/crates/anima-execution-store-sqlite" }
anima-memory-store-sqlite = { path = "../../packages/core-rust/crates/anima-memory-store-sqlite" }
anima-document-content = { path = "../../packages/core-rust/crates/anima-document-content" }
anima-model-adapters = { path = "../../packages/core-rust/crates/anima-model-adapters" }
anima-memory = { path = "../../packages/core-rust/crates/anima-memory", features = ["locomo-eval"] }
anima-acp = { path = "../../packages/core-rust/crates/anima-acp" }
anima-process = { path = "../../packages/core-rust/crates/anima-process" }
anima-schedule = { path = "../../packages/core-rust/crates/anima-schedule" }
anima-swarm = { path = "../../packages/core-rust/crates/anima-swarm" }
anima-worktree = { path = "../../packages/core-rust/crates/anima-worktree" }
atomicwrites = "0.4.4"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
async-trait = "0.1"
base64 = "0.22"
hmac = "0.13"
sha2 = "0.11"
axum = "0.8"
http-body-util = "0.1"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
fastembed = { version = "7.2", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
futures = "0.3"
keyring = "4.1.6"
meval = "0.2"
regex = "1"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-streamable-http-client", "transport-async-rw"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
sse-stream = "=0.2.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
serde_yaml = "0.9"
sqlx = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["request-id", "timeout", "trace"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
tempfile = "=3.27.0"
tokio-util = { version = "=0.7.18", features = ["rt"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
zeroize = "1.9"
twilight-gateway = { version = "=0.17.1", default-features = false, features = ["rustls-webpki-roots"] }
twilight-model = "=0.17.1"

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
rfd = "0.17.2"
win-custody = "=0.1.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process", "fs"] }

[[example]]
name = "document_worker_peer"
path = "tests/fixtures/document_worker_peer.rs"

[[example]]
name = "mcp_stdio_peer"
path = "tests/fixtures/mcp_stdio_peer.rs"

[lints]
workspace = true

[dev-dependencies]
anima-harness = { path = "../../packages/core-rust/crates/anima-harness", features = ["test-support"] }

# Only `anima` ships in releases (dist-workspace.toml).
[package.metadata.dist]
dist = false

[[example]]
name = "execution_backend_peer"
path = "tests/fixtures/execution_backend_peer.rs"

[[example]]
name = "paired_node_peer"
path = "tests/fixtures/paired_node_peer.rs"
