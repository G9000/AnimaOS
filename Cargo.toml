[workspace]
members = [
    "packages/core-rust/crates/anima-core",
    "packages/core-rust/crates/anima-service-adapters",
    "packages/core-rust/crates/anima-document-content",
    "packages/core-rust/crates/anima-process",
    "packages/core-rust/crates/anima-acp",
    "packages/core-rust/crates/anima-worktree",
    "packages/core-rust/crates/anima-harness",
    "packages/core-rust/crates/anima-model-adapters",
    "packages/core-rust/crates/anima-memory",
    "packages/core-rust/crates/anima-schedule",
    "packages/core-rust/crates/anima-swarm",
    "hosts/rust-daemon",
    "hosts/anima",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["animaOS contributors"]

[workspace.dependencies]
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "migrate", "macros", "json", "chrono"], default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Constructors and event records in the engine take many explicit fields by
# design; a builder per record would add indirection without removing risk.
too_many_arguments = "allow"
# Nested generic return types (e.g. async adapter results) are clearer inline.
type_complexity = "allow"
# Workspace types are constructed explicitly; `Default` is not part of their API.
new_without_default = "allow"

# Keep local/test builds useful for backtraces without storing full dependency
# symbols or incremental test state in the build cache.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
