[package]
name = "anima-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
test-support = []

[lints]
workspace = true

[dependencies]
anima-core = { path = "../anima-core" }
anima-model-adapters = { path = "../anima-model-adapters" }
anima-memory = { path = "../anima-memory" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
anima-execution-store-sqlite = { path = "../anima-execution-store-sqlite" }
anima-memory-store-sqlite = { path = "../anima-memory-store-sqlite" }
tempfile = "=3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
