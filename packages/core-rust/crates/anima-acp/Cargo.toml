[package]
name = "anima-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# Scripted ACP agent for this crate's integration tests only (reached through
# CARGO_BIN_EXE_fake-acp-agent). Never a runtime agent.
[[bin]]
name = "fake-acp-agent"
path = "tests/fixtures/fake_acp_agent.rs"
test = false
doc = false

[dependencies]
anima-process = { path = "../anima-process" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "sync", "time"] }
