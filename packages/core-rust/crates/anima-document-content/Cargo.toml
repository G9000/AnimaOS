[package]
name = "anima-document-content"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anima-service-adapters = { path = "../anima-service-adapters" }
rawzip = { version = "=0.5.2", default-features = false, features = ["std"] }
quick-xml = { version = "=0.41.0", default-features = false }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
pdf-extract = { version = "=0.12.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
lopdf = { version = "=0.42.0", default-features = false }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
unicode-normalization = "=0.1.25"
