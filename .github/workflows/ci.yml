name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - name: Check formatting of changed files
        run: git diff --name-only --diff-filter=ACMR -z remotes/origin/main...HEAD | xargs -0 -r bun x prettier --check --ignore-unknown
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run typecheck
      - run: bun x playwright install --with-deps
      - run: bun run --filter @animaos/web-e2e e2e-ci
      - run: bun run --filter @animaos/web-e2e e2e-console
