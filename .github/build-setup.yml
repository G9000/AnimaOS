# Steps dist runs before `cargo build` in each release build job (see
# github-build-setup in dist-workspace.toml): the bundled-ui feature embeds
# apps/web/dist, so the web console is built first.
#
# The build job's environment holds the macOS code-signing secrets (and a token
# that can write releases). JavaScript packages run code here, so these steps
# blank them, and install without running any package's install scripts.
- name: Install Node.js
  uses: actions/setup-node@v4
  with:
    node-version: 24
- name: Install Bun
  uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
  with:
    bun-version: 1.4.3
  env:
    CODESIGN_CERTIFICATE: ''
    CODESIGN_CERTIFICATE_PASSWORD: ''
    CODESIGN_IDENTITY: ''
    GH_TOKEN: ''
- name: Install JavaScript dependencies
  run: bun install --frozen-lockfile --ignore-scripts
  env:
    CODESIGN_CERTIFICATE: ''
    CODESIGN_CERTIFICATE_PASSWORD: ''
    CODESIGN_IDENTITY: ''
    GH_TOKEN: ''
- name: Build the web console
  run: |
    bun x nx run @animaos/sdk:build
    bun x nx run @animaos/web:build
  shell: bash
  env:
    NX_NO_CLOUD: true
    NX_DAEMON: false
    CODESIGN_CERTIFICATE: ''
    CODESIGN_CERTIFICATE_PASSWORD: ''
    CODESIGN_IDENTITY: ''
    GH_TOKEN: ''
