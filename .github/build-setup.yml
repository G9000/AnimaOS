# Steps dist runs before `cargo build` in each release build job (see
# github-build-setup in dist-workspace.toml): the bundled-ui feature embeds
# apps/web/dist, so the web console is built first.
- name: Install Bun
  uses: oven-sh/setup-bun@v2
  with:
    bun-version: 1.3.8
- name: Install JavaScript dependencies
  run: bun install --frozen-lockfile
- name: Build the web console
  run: |
    bun x nx run @animaOS-SWARM/sdk:build
    bun x nx run @animaOS-SWARM/web:build
  shell: bash
  env:
    NX_NO_CLOUD: true
    NX_DAEMON: false
